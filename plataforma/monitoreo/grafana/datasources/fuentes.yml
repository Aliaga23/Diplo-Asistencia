apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: Plataforma
    uid: plataforma
    type: grafana-postgresql-datasource
    url: db:5432
    user: plataforma
    jsonData:
      database: plataforma
      sslmode: disable
      postgresVersion: 1800
    secureJsonData:
      password: $PLATAFORMA_BD_PASSWORD
