apiVersion: 1
groups:
- orgId: 1
  name: salud-tenants
  folder: Presencia
  interval: 1m
  rules:
  - uid: tenant-caido
    title: Tenant caído
    condition: C
    for: 2m
    noDataState: OK
    execErrState: Error
    labels:
      severidad: critica
    annotations:
      summary: El servidor {{ .Labels.rol }} del tenant {{ .Labels.tenant }} no responde
        ({{ .Labels.job }})
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: min by (tenant, rol, job) (up)
        instant: true
        range: false
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
  - uid: cpu-alta
    title: CPU alta
    condition: C
    for: 5m
    noDataState: OK
    execErrState: Error
    labels:
      severidad: advertencia
    annotations:
      summary: CPU sobre 85 % en {{ .Labels.tenant }} ({{ .Labels.rol }})
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: 100 - avg by (tenant, rol) (rate(node_cpu_seconds_total{mode="idle"}[5m]))
          * 100
        instant: true
        range: false
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 85
  - uid: disco-lleno
    title: Disco casi lleno
    condition: C
    for: 5m
    noDataState: OK
    execErrState: Error
    labels:
      severidad: advertencia
    annotations:
      summary: Disco sobre 85 % en {{ .Labels.tenant }} ({{ .Labels.rol }})
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})
          * 100
        instant: true
        range: false
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 85
  - uid: errores-5xx
    title: Errores 5xx
    condition: C
    for: 5m
    noDataState: OK
    execErrState: Error
    labels:
      severidad: advertencia
    annotations:
      summary: Más del 5 % de las peticiones de {{ .Labels.tenant }} terminan en error
        5xx
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: 100 * sum by (tenant) (rate(http_requests_total{status="5xx"}[5m]))
          / clamp_min(sum by (tenant) (rate(http_requests_total[5m])), 0.0001)
        instant: true
        range: false
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 5
