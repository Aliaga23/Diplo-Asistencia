    descripcion: PostgreSQL en un servidor aparte, solo accesible desde la app

avanzado:
  nombre: Avanzado
  descripcion: Universidades. Base de datos administrada por AWS con respaldos diarios.
  costo_dia_usd: 1.15
  estudiantes: 10000
