basico:
  nombre: Básico
  descripcion: Institutos pequeños o una demo. Todo en un solo servidor.
  costo_dia_usd: 0.40
  estudiantes: 100
  app:
    tipo: t3.micro
    vcpu: 2
    memoria_gib: 1
    disco_gb: 10
