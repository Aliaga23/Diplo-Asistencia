name: diplo-asistencia

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: asistencia
      POSTGRES_PASSWORD: asistencia
      POSTGRES_DB: asistencia
      TZ: America/La_Paz
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 guarda los datos en /var/lib/postgresql/<versión>/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asistencia -d asistencia"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://asistencia:asistencia@db:5432/asistencia
      JWT_SECRET: ${JWT_SECRET:-cambiar-este-secreto-en-produccion-0123456789}
      CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-3001}"]'
      TIMEZONE: America/La_Paz
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD:-admin1234!}
      ADMIN_REGISTRATION: ${ADMIN_REGISTRATION:-218166141}
      SEED_DEMO: ${SEED_DEMO:-true}
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3001}:3000"

volumes:
  pgdata:
