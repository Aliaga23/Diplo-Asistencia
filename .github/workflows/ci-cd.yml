name: CI/CD

# Push a main: pruebas → imágenes en GHCR → despliegue en el VPS «arturo».
# En pull requests solo corren las pruebas.
on:
  push:
    branches: [main]
    # Un cambio que solo toca documentación no redespliega.
    paths-ignore: ["docs/**", "README.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGEN: ghcr.io/aliaga23/diplo-asistencia

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
      - name: Backend (lint y pruebas)
        working-directory: backend
        run: |
          uv sync --locked
          uv run ruff check .
          uv run pytest -q

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
      - name: Frontend (lint y tipos)
        working-directory: frontend
        run: |
          npm install -g pnpm@12.11.2
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck

  imagenes:
    name: Imágenes
    needs: pruebas
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: ${{ env.IMAGEN }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Frontend
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          tags: ${{ env.IMAGEN }}/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  desplegar:
    name: Desplegar
    needs: imagenes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: arturo
      url: https://diplo.jorgearturo.net
    permissions:
      contents: read
      packages: read
    env:
      VPS: ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}
    steps:
      - uses: actions/checkout@v7

      - name: Clave SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Subir compose
        run: scp deploy/arturo/compose.yaml "$VPS:/opt/diplo-asistencia/compose.nuevo.yaml"

      - name: Desplegar
        env:
          TAG: ${{ github.sha }}
          REG_USER: ${{ github.actor }}
          REG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh "$VPS" "TAG='$TAG' REG_USER='$REG_USER' REG_TOKEN='$REG_TOKEN' bash -s" <<'EOF'
          set -euo pipefail
          cd /opt/diplo-asistencia

          # Valida la configuración nueva antes de reemplazar la que funciona.
          sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$TAG|" .env
          docker compose -f compose.nuevo.yaml config -q
          mv compose.nuevo.yaml compose.yaml

          # Token efímero de GitHub: no queda ninguna credencial en el servidor.
          echo "$REG_TOKEN" | docker login ghcr.io -u "$REG_USER" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          for intento in 1 2 3; do docker compose pull -q && break; sleep 10; done

          # El backend aplica las migraciones al arrancar; --wait espera los healthchecks.
          if ! docker compose up -d --remove-orphans --wait --wait-timeout 180; then
            docker compose logs --tail 80 backend frontend
            exit 1
          fi
          docker image prune -f >/dev/null
          echo "Desplegado: $TAG"
          EOF

      - name: Verificar
        run: |
          curl -fsS --max-time 15 -o /dev/null https://diplo.jorgearturo.net/login \
            && echo "https://diplo.jorgearturo.net responde" \
            || echo "::warning::El dominio todavía no responde (¿falta el registro DNS en Cloudflare?)"
