name: Release

# Push a main → CI → construir y publicar las imágenes en GHCR → desplegar en «arturo».
# El VPS no compila: solo baja lo que sale de aquí, con el mismo tag para las dos imágenes.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - docs/**

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # El tag se calcula una vez: backend y frontend quedan con el mismo por construcción.
  preparar:
    name: Calcular tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      repo: ${{ steps.meta.outputs.repo }}
    steps:
      - id: meta
        run: |
          # GHCR solo acepta minúsculas y github.repository conserva «Aliaga23».
          echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

  imagenes:
    name: Publicar ${{ matrix.servicio }} en GHCR
    needs: [ci, preparar]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        servicio: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Entrar a GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.servicio }}
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ needs.preparar.outputs.repo }}/${{ matrix.servicio }}:${{ needs.preparar.outputs.tag }}
            ghcr.io/${{ needs.preparar.outputs.repo }}/${{ matrix.servicio }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}

  desplegar:
    name: Desplegar
    needs: [preparar, imagenes]
    # Sin DEPLOY_ENABLED=true se publican las imágenes pero no se toca el servidor.
    if: vars.DEPLOY_ENABLED == 'true'
    # Un flujo llamado no puede pedir más permisos que los que le da quien lo llama:
    # el servidor baja las imágenes privadas con este token (packages: read).
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/desplegar.yml
    with:
      tag: ${{ needs.preparar.outputs.tag }}
    secrets: inherit
