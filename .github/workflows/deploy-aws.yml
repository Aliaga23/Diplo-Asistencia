name: Despliegue automatico AWS

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-presencia-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar Diplo-Asistencia
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Autenticar en AWS mediante OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::359013545184:role/presencia-dev-github-deploy
          aws-region: us-east-1
          role-session-name: presencia-github-deploy

      - name: Verificar identidad AWS
        run: aws sts get-caller-identity

      - name: Desplegar backend y frontend mediante SSM
        shell: bash
        run: |
          set -euo pipefail

          deploy() {
            local component="$1"
            local instance="$2"

            echo "Desplegando $component en $instance"

            local command
            command="sudo -u ubuntu -H bash -c 'cd /opt/presencia/app && git fetch origin main && git checkout main && git reset --hard origin/main && bash infraestructure/environments/dev/scripts/deploy-${component}.sh'"

            DEPLOY_COMMAND="$command" python3 -c \
              'import json, os; json.dump({"commands": [os.environ["DEPLOY_COMMAND"]]}, open("ssm-params.json", "w"))'

            local command_id
            command_id=$(aws ssm send-command \
              --instance-ids "$instance" \
              --document-name "AWS-RunShellScript" \
              --parameters file://ssm-params.json \
              --comment "Deploy presencia $component" \
              --query "Command.CommandId" \
              --output text)

            echo "Comando SSM: $command_id"

            local status=""
            for attempt in $(seq 1 80); do
              status=$(aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$instance" \
                --query "Status" \
                --output text 2>/dev/null) || status="Pending"

              echo "$component: $status"

              case "$status" in
                Success)
                  echo "Despliegue $component correcto"
                  return 0
                  ;;
                Failed|Cancelled|TimedOut|Cancelling)
                  echo "Error de despliegue $component"
                  aws ssm get-command-invocation \
                    --command-id "$command_id" \
                    --instance-id "$instance" \
                    --query "[StandardOutputContent,StandardErrorContent]" \
                    --output text || true
                  return 1
                  ;;
              esac

              sleep 15
            done

            echo "Tiempo de espera agotado para $component"
            return 1
          }

          deploy backend i-0d8836b78ba672af9
          deploy frontend i-0b8c8b29697b324fb

      - name: Confirmar despliegue
        run: |
          echo "Diplo-Asistencia desplegado correctamente."
          echo "Commit: $GITHUB_SHA"
