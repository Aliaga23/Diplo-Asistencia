[defaults]
inventory = inventory/hosts.ini
remote_user = ubuntu
private_key_file = ~/.ssh/presencia-aws
# Las EC2 son nuevas en cada apply: no hay host key conocida que comparar.
host_key_checking = False
interpreter_python = auto_silent
callback_result_format = yaml

[ssh_connection]
# Ejecuta los modulos sin archivos temporales; permite become_user a ubuntu o postgres sin paquete acl.
pipelining = True
