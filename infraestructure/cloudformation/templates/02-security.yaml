AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Presencia - Seguridad (equivale a modules/security + iam.tf de Terraform).
  Security groups del frontend y backend con minimo privilegio y rol IAM para SSM.

Parameters:
  Proyecto:
    Type: String
    Default: asistencia
    AllowedPattern: "^[a-z][a-z0-9-]{2,23}$"

  Ambiente:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

  AdminCidr:
    Type: String
    Description: IP autorizada para SSH. Usa tu IP publica /32 (minimo /24).
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/(2[4-9]|3[0-2])$"
    ConstraintDescription: CIDR IPv4 /24 o mas restrictivo. Preferiblemente tu IP /32.

  BackendApiPort:
    Type: Number
    Default: 8000
    MinValue: 1024
    MaxValue: 65535

Resources:
  # ==========================
  # SECURITY GROUP FRONTEND
  # ==========================
  # Las reglas de salida se declaran en linea para REEMPLAZAR la regla por defecto
  # de AWS (todo el trafico a 0.0.0.0/0). Igual que en Terraform: solo 80, 443 y NTP.
  FrontendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    # Excepciones justificadas: es el servidor web publico (Nginx) y no hay ALB.
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_260
            comment: El frontend es la web publica; el puerto 80 redirige a HTTPS (443).
      cfn_nag:
        rules_to_suppress:
          - id: W2
            reason: Servidor web publico sin ALB; solo 80/443 abiertos a internet.
          - id: W9
            reason: 80/443 deben ser publicos; SSH si esta limitado a AdminCidr.
          - id: W5
            reason: Salida solo 80/443/123 para apt, GitHub, NodeSource y SSM (sin NAT ni VPC endpoints).
    Properties:
      GroupDescription: Security Group del frontend
      VpcId:
        Fn::ImportValue: !Sub "${Proyecto}-${Ambiente}-VpcId"
      SecurityGroupIngress:
        - Description: HTTP publico
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - Description: HTTPS publico
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - Description: SSH administrativo
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr
      SecurityGroupEgress:
        - Description: Salida HTTP (paquetes)
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          # trivy:ignore:AWS-0104
          CidrIp: 0.0.0.0/0
        - Description: Salida HTTPS (paquetes, GitHub, SSM)
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          # trivy:ignore:AWS-0104
          CidrIp: 0.0.0.0/0
        - Description: Salida NTP
          IpProtocol: udp
          FromPort: 123
          ToPort: 123
          # trivy:ignore:AWS-0104
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${Proyecto}-${Ambiente}-frontend-sg"

  # ==========================
  # SECURITY GROUP BACKEND
  # ==========================
  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W5
            reason: Salida solo 80/443/123 para apt, uv/PyPI y SSM (sin NAT ni VPC endpoints).
    Properties:
      GroupDescription: Security Group del backend
      VpcId:
        Fn::ImportValue: !Sub "${Proyecto}-${Ambiente}-VpcId"
      SecurityGroupIngress:
        - Description: SSH administrativo
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr
      SecurityGroupEgress:
        - Description: Salida HTTP (paquetes)
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          # trivy:ignore:AWS-0104
          CidrIp: 0.0.0.0/0
        - Description: Salida HTTPS (paquetes, GitHub, SSM)
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          # trivy:ignore:AWS-0104
          CidrIp: 0.0.0.0/0
        - Description: Salida NTP
          IpProtocol: udp
          FromPort: 123
          ToPort: 123
          # trivy:ignore:AWS-0104
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${Proyecto}-${Ambiente}-backend-sg"

  # ==========================
  # FRONTEND <-> BACKEND
  # ==========================
  # Reglas separadas para evitar la dependencia circular entre los dos grupos.
  BackendIngressFromFrontend:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref BackendSecurityGroup
      Description: API desde el frontend
      IpProtocol: tcp
      FromPort: !Ref BackendApiPort
      ToPort: !Ref BackendApiPort
      SourceSecurityGroupId: !Ref FrontendSecurityGroup

  FrontendEgressToBackend:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref FrontendSecurityGroup
      Description: Comunicacion privada con FastAPI
      IpProtocol: tcp
      FromPort: !Ref BackendApiPort
      ToPort: !Ref BackendApiPort
      DestinationSecurityGroupId: !Ref BackendSecurityGroup

  # ==========================
  # IAM: ACCESO POR SSM
  # ==========================
  SsmRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
      Tags:
        - Key: Name
          Value: !Sub "${Proyecto}-${Ambiente}-cfn-ssm-role"

  SsmInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref SsmRole

Outputs:
  FrontendSecurityGroupId:
    Value: !Ref FrontendSecurityGroup
    Export:
      Name: !Sub "${Proyecto}-${Ambiente}-FrontendSgId"

  BackendSecurityGroupId:
    Value: !Ref BackendSecurityGroup
    Export:
      Name: !Sub "${Proyecto}-${Ambiente}-BackendSgId"

  InstanceProfileName:
    Value: !Ref SsmInstanceProfile
    Export:
      Name: !Sub "${Proyecto}-${Ambiente}-InstanceProfile"
