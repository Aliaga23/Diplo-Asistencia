AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Presencia / Asistencia - Stack Principal (Orquestador de Stacks Anidados).
  Despliega en un unico paquete: Red (VPC/IGW/Flow Logs) -> Seguridad (SGs/IAM) -> Servidor (Frontend y Backend EC2).

Parameters:
  Proyecto:
    Type: String
    Default: asistencia
    AllowedPattern: "^[a-z][a-z0-9-]{2,23}$"
    ConstraintDescription: Entre 3 y 24 caracteres minusculos, numeros o guiones.

  Ambiente:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

  AdminCidr:
    Type: String
    Description: IP autorizada para SSH. Usa tu IP publica /32 (minimo /24). Ej. 189.28.74.200/32
    Default: 0.0.0.0/0
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/(2[4-9]|3[0-2]|0)$"
    ConstraintDescription: CIDR IPv4 /24 o mas restrictivo (ej. tu IP /32).

  SshPublicKey:
    Type: String
    Default: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPqgE80/rJ98L5mP0zH+uB5k1C4vN3Zl7qL0yX1pW8r2 asistencia-dev"
    Description: Contenido de la clave SSH publica (~/.ssh/presencia-aws.pub)
    AllowedPattern: "^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp256) .+"

  RepoUrl:
    Type: String
    Default: https://github.com/sebastianmlz/presencia-aws.git
    Description: URL HTTPS del repositorio PUBLICO de GitHub con frontend/ y backend/
    AllowedPattern: "^https://.+\\.git$"
    ConstraintDescription: Debe ser una URL https que termine en .git

  RepoBranch:
    Type: String
    Default: main
    AllowedPattern: "^[A-Za-z0-9._/-]+$"

  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/(1[6-9]|2[0-8])$"

  PublicSubnetCidr:
    Type: String
    Default: 10.20.1.0/24
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/(1[6-9]|2[0-8])$"

  FrontendInstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.micro, t3.small, t3.medium]

  BackendInstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t3.medium]

  AsignarIpPublicaBackend:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Asignar IP publica al backend para salida a internet.

  DatosDemo:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Cargar datos de prueba de estudiantes y sesiones.

  CrearBackend:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Desplegar segunda instancia EC2 (Backend). Integrante 1 puede usar false y el Integrante 2 true.

Conditions:
  BackendHabilitado: !Equals [!Ref CrearBackend, "true"]

Resources:
  # ========================================================
  # STACK ANIDADO 1: RED
  # VPC, Internet Gateway, subred publica, rutas, Flow Logs
  # ========================================================
  Red:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: red.yaml
      Parameters:
        Proyecto: !Ref Proyecto
        Ambiente: !Ref Ambiente
        VpcCidr: !Ref VpcCidr
        PublicSubnetCidr: !Ref PublicSubnetCidr

  # ========================================================
  # STACK ANIDADO 2: SEGURIDAD
  # Security Groups de frontend y backend, rol IAM para SSM
  # ========================================================
  Seguridad:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: seguridad.yaml
      Parameters:
        Proyecto: !Ref Proyecto
        Ambiente: !Ref Ambiente
        AdminCidr: !Ref AdminCidr
        VpcId: !GetAtt Red.Outputs.VpcId

  # ========================================================
  # STACK ANIDADO 3: SERVIDORES (COMPUTO)
  # EC2 frontend (Next.js + Nginx), backend (FastAPI + Postgres), IP elastica
  # ========================================================
  Servidor:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: servidor.yaml
      Parameters:
        Proyecto: !Ref Proyecto
        Ambiente: !Ref Ambiente
        PublicSubnetId: !GetAtt Red.Outputs.PublicSubnetId
        FrontendSecurityGroupId: !GetAtt Seguridad.Outputs.FrontendSecurityGroupId
        BackendSecurityGroupId: !GetAtt Seguridad.Outputs.BackendSecurityGroupId
        InstanceProfileName: !GetAtt Seguridad.Outputs.InstanceProfileName
        SshPublicKey: !Ref SshPublicKey
        RepoUrl: !Ref RepoUrl
        RepoBranch: !Ref RepoBranch
        FrontendInstanceType: !Ref FrontendInstanceType
        BackendInstanceType: !Ref BackendInstanceType
        AsignarIpPublicaBackend: !Ref AsignarIpPublicaBackend
        DatosDemo: !Ref DatosDemo
        CrearBackend: !Ref CrearBackend

Outputs:
  UrlAplicacion:
    Description: Abrir en el navegador (esperar unos 10-15 minutos tras CREATE_COMPLETE para que compile Next.js)
    Value: !GetAtt Servidor.Outputs.UrlAplicacion

  FrontendPublicIp:
    Description: IP publica elastica del frontend
    Value: !GetAtt Servidor.Outputs.FrontendPublicIp

  BackendPublicIp:
    Description: IP publica del servidor backend
    Condition: BackendHabilitado
    Value: !GetAtt Servidor.Outputs.BackendPublicIp

  SshFrontend:
    Description: Comando de conexion SSH al frontend
    Value: !GetAtt Servidor.Outputs.SshFrontend

  SshBackend:
    Description: Comando de conexion SSH al backend
    Condition: BackendHabilitado
    Value: !GetAtt Servidor.Outputs.SshBackend

  ApiUrlInterna:
    Description: URL privada interna de FastAPI
    Condition: BackendHabilitado
    Value: !GetAtt Servidor.Outputs.ApiUrlInterna

  VpcId:
    Description: ID de la VPC creada en el stack de Red
    Value: !GetAtt Red.Outputs.VpcId

  PublicSubnetId:
    Description: ID de la subred publica creada en el stack de Red
    Value: !GetAtt Red.Outputs.PublicSubnetId

  FrontendSecurityGroupId:
    Description: ID del SG frontend creado en el stack de Seguridad
    Value: !GetAtt Seguridad.Outputs.FrontendSecurityGroupId

  BackendSecurityGroupId:
    Description: ID del SG backend creado en el stack de Seguridad
    Value: !GetAtt Seguridad.Outputs.BackendSecurityGroupId
