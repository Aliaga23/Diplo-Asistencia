AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Asistencia - Servidores y Computo (stack anidado).
  Dos EC2 Ubuntu 24.04: frontend (Next.js + Nginx) y backend (FastAPI + PostgreSQL).

Parameters:
  Proyecto:
    Type: String
    Default: asistencia
    AllowedPattern: "^[a-z][a-z0-9-]{2,23}$"

  Ambiente:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: ID de la subred publica (proporcionado por el stack de red)

  FrontendSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: ID del Security Group del frontend (proporcionado por el stack de seguridad)

  BackendSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: ID del Security Group del backend (proporcionado por el stack de seguridad)

  InstanceProfileName:
    Type: String
    Description: Nombre del Instance Profile IAM para SSM (proporcionado por el stack de seguridad)

  # Ubuntu 24.04 oficial de Canonical, resuelto por SSM (equivale a data "aws_ami")
  UbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id

  SshPublicKey:
    Type: String
    Default: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKLUxmthEAiTpVxpFkRzgv9itlyXib+p1cHhcOZYHtTh presencia-aliaga23"
    Description: Contenido de la clave publica (~/.ssh/presencia-aws.pub)
    AllowedPattern: "^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp256) .+"

  FrontendInstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.micro, t3.small, t3.medium]

  BackendInstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t3.medium]

  FrontendPrivateIp:
    Type: String
    Default: 10.20.1.10

  BackendPrivateIp:
    Type: String
    Default: 10.20.1.20

  FrontendVolumeSize:
    Type: Number
    Default: 20
    MinValue: 8
    MaxValue: 100

  BackendVolumeSize:
    Type: Number
    Default: 20
    MinValue: 8
    MaxValue: 100

  CpuCredits:
    Type: String
    Default: standard
    AllowedValues: [standard, unlimited]

  DetailedMonitoring:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Monitoreo detallado de CloudWatch (1 min). Tiene costo adicional.

  AsignarIpPublicaBackend:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      IP publica del backend para salir a internet (apt, uv). Con "false" el backend
      queda solo privado, pero necesita NAT Gateway o VPC endpoints para instalar paquetes.

  RepoUrl:
    Type: String
    Default: https://github.com/Aliaga23/Diplo-Asistencia.git
    Description: URL HTTPS del repositorio PUBLICO con frontend/ y backend/
    AllowedPattern: "^https://.+\\.git$"
    ConstraintDescription: Debe ser una URL https que termine en .git

  RepoBranch:
    Type: String
    Default: main
    AllowedPattern: "^[A-Za-z0-9._/-]+$"

  DatosDemo:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Carga estudiantes, sesiones y asistencia de ejemplo (app.seed --demo).

  CrearFrontend:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Crear primera instancia EC2 (Frontend). Integrante 1.

  CrearBackend:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Crear segunda instancia EC2 (Backend). Integrante 2.

Conditions:
  DesplegarFrontend: !Equals [!Ref CrearFrontend, "true"]
  DesplegarBackend: !Equals [!Ref CrearBackend, "true"]
  CargarDemo: !Equals [!Ref DatosDemo, "true"]
  UsarMonitoreoDetallado: !Equals [!Ref DetailedMonitoring, "true"]
  BackendConIpPublica: !And
    - !Condition DesplegarBackend
    - !Equals [!Ref AsignarIpPublicaBackend, "true"]

Resources:
  # ==========================
  # CLAVE SSH PUBLICA
  # ==========================
  AdminKeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Sub "${Proyecto}-${Ambiente}-cfn-admin"
      PublicKeyMaterial: !Ref SshPublicKey

  # ==========================
  # PLANTILLA COMUN (IMDSv2, disco cifrado)
  # ==========================
  ServerLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${Proyecto}-${Ambiente}-cfn-lt"
      LaunchTemplateData:
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 1

  # ==========================
  # FRONTEND EC2
  # ==========================
  FrontendInstance:
    Type: AWS::EC2::Instance
    Condition: DesplegarFrontend
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_88
            comment: Es el servidor web publico; recibe la IP elastica FrontendEip.
    Properties:
      ImageId: !Ref UbuntuAmi
      InstanceType: !Ref FrontendInstanceType
      KeyName: !Ref AdminKeyPair
      IamInstanceProfile: !Ref InstanceProfileName
      LaunchTemplate:
        LaunchTemplateId: !Ref ServerLaunchTemplate
        Version: !GetAtt ServerLaunchTemplate.LatestVersionNumber
      EbsOptimized: true
      Monitoring: !If [UsarMonitoreoDetallado, true, false]
      CreditSpecification:
        CPUCredits: !Ref CpuCredits
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref PublicSubnetId
          PrivateIpAddress: !Ref FrontendPrivateIp
          AssociatePublicIpAddress: true
          GroupSet:
            - !Ref FrontendSecurityGroupId
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref FrontendVolumeSize
            Encrypted: true
            DeleteOnTermination: true
      # Copia literal de infraestructure/cloud-init/frontend.yaml: CloudFormation no puede leer
      # archivos externos, asi que el cloud-config va embebido y !Sub rellena los marcadores.
      UserData:
        Fn::Base64: !Sub
          - |
            #cloud-config
            # Frontend de Presencia: Nginx (80) -> Next.js (127.0.0.1:3000) -> FastAPI en la IP privada del backend.
            #
            # Plantilla compartida por CloudFormation, Terraform y Pulumi (ver README.md de esta carpeta).
            # Los marcadores entre llaves los rellena cada herramienta antes de entregarla como user data;
            # en el shell se usa $VAR sin llaves para no chocar con ellos.

            # Compilar Next.js en los 2 GB de RAM de una t3.small puede quedarse sin memoria.
            swap:
              filename: /swapfile
              size: 2147483648
              maxsize: 2147483648

            package_update: true
            packages:
              - curl
              - ca-certificates
              - gnupg
              - git
              - nginx

            write_files:
              - path: /etc/presencia-frontend.env
                permissions: "0644"
                content: |
                  NODE_ENV=production
                  PORT=3000
                  HOSTNAME=127.0.0.1
                  API_URL=http://${backend_private_ip}:8000
                  NEXT_TELEMETRY_DISABLED=1

              - path: /etc/systemd/system/presencia-frontend.service
                permissions: "0644"
                content: |
                  [Unit]
                  Description=Presencia frontend (Next.js)
                  After=network-online.target
                  Wants=network-online.target

                  [Service]
                  User=ubuntu
                  WorkingDirectory=/opt/presencia/app/frontend/.next/standalone
                  EnvironmentFile=/etc/presencia-frontend.env
                  ExecStart=/usr/bin/node server.js
                  Restart=always
                  RestartSec=5
                  NoNewPrivileges=true

                  [Install]
                  WantedBy=multi-user.target

              # defer: se escribe despues de instalar los paquetes, cuando /etc/nginx ya existe.
              - path: /etc/nginx/sites-available/presencia
                permissions: "0644"
                defer: true
                content: |
                  server {
                    listen 80 default_server;
                    server_name _;
                    server_tokens off;
                    client_max_body_size 10m;
                    location / {
                      proxy_pass http://127.0.0.1:3000;
                      proxy_http_version 1.1;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto $scheme;
                    }
                  }

            # cloud-init junta todo runcmd en un solo script: "set -eu" lo corta en el primer error.
            runcmd:
              - set -eu
              - curl -fsSL https://deb.nodesource.com/setup_24.x -o /tmp/nodesource.sh
              - bash /tmp/nodesource.sh
              - DEBIAN_FRONTEND=noninteractive apt-get install -y nodejs
              - corepack enable
              - install -d -o ubuntu -g ubuntu /opt/presencia
              - sudo -u ubuntu git clone --depth 1 --branch ${repo_branch} ${repo_url} /opt/presencia/app
              - >-
                sudo -u ubuntu -H env COREPACK_ENABLE_DOWNLOAD_PROMPT=0 NEXT_TELEMETRY_DISABLED=1
                API_URL=http://${backend_private_ip}:8000
                bash -c "cd /opt/presencia/app/frontend && pnpm install --frozen-lockfile && (pnpm build || pnpm build)
                && cp -r public .next/standalone/ && mkdir -p .next/standalone/.next
                && cp -r .next/static .next/standalone/.next/"
              - systemctl daemon-reload
              - systemctl enable --now presencia-frontend
              - rm -f /etc/nginx/sites-enabled/default
              - ln -sf /etc/nginx/sites-available/presencia /etc/nginx/sites-enabled/presencia
              - nginx -t
              - systemctl reload nginx
              - curl -fsS --retry 20 --retry-delay 3 --retry-connrefused -o /dev/null http://127.0.0.1:3000/login

            final_message: "Presencia frontend listo tras $UPTIME s (cloud-init $VERSION)"
          - backend_private_ip: !Ref BackendPrivateIp
            repo_url: !Ref RepoUrl
            repo_branch: !Ref RepoBranch
      Tags:
        - Key: Name
          Value: !Sub "${Proyecto}-${Ambiente}-frontend"
        - Key: Role
          Value: frontend

  # IP elastica del frontend (la URL publica de la web)
  FrontendEip:
    Type: AWS::EC2::EIP
    Condition: DesplegarFrontend
    Properties:
      Domain: vpc
      InstanceId: !Ref FrontendInstance
      Tags:
        - Key: Name
          Value: !Sub "${Proyecto}-${Ambiente}-frontend-eip"

  # ==========================
  # BACKEND EC2 (Segunda Instancia)
  # ==========================
  BackendInstance:
    Type: AWS::EC2::Instance
    Condition: DesplegarBackend
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_88
            comment: Sin NAT Gateway (costo) el backend necesita IP publica para salir; la API (8000) solo acepta al SG del frontend.
    Properties:
      ImageId: !Ref UbuntuAmi
      InstanceType: !Ref BackendInstanceType
      KeyName: !Ref AdminKeyPair
      IamInstanceProfile: !Ref InstanceProfileName
      LaunchTemplate:
        LaunchTemplateId: !Ref ServerLaunchTemplate
        Version: !GetAtt ServerLaunchTemplate.LatestVersionNumber
      EbsOptimized: true
      Monitoring: !If [UsarMonitoreoDetallado, true, false]
      CreditSpecification:
        CPUCredits: !Ref CpuCredits
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref PublicSubnetId
          PrivateIpAddress: !Ref BackendPrivateIp
          AssociatePublicIpAddress: !If [BackendConIpPublica, true, false]
          GroupSet:
            - !Ref BackendSecurityGroupId
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref BackendVolumeSize
            Encrypted: true
            DeleteOnTermination: true
      # Copia literal de infraestructure/cloud-init/backend.yaml: CloudFormation no puede leer
      # archivos externos, asi que el cloud-config va embebido y !Sub rellena los marcadores.
      UserData:
        Fn::Base64: !Sub
          - |
            #cloud-config
            # Backend de Presencia: FastAPI (0.0.0.0:8000; el SG solo deja entrar al frontend) + PostgreSQL local.
            #
            # Plantilla compartida por CloudFormation, Terraform y Pulumi (ver README.md de esta carpeta).
            # Los marcadores entre llaves los rellena cada herramienta antes de entregarla como user data;
            # en el shell se usa $VAR sin llaves para no chocar con ellos.

            package_update: true
            packages:
              - git
              - curl
              - ca-certificates
              - build-essential
              - libpq-dev
              - postgresql

            write_files:
              - path: /etc/systemd/system/presencia-backend.service
                permissions: "0644"
                content: |
                  [Unit]
                  Description=Presencia backend (FastAPI)
                  After=network-online.target postgresql.service
                  Wants=network-online.target
                  Requires=postgresql.service

                  [Service]
                  User=ubuntu
                  WorkingDirectory=/opt/presencia/app/backend
                  ExecStart=/opt/presencia/app/backend/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers
                  Restart=always
                  RestartSec=5
                  NoNewPrivileges=true

                  [Install]
                  WantedBy=multi-user.target

            # cloud-init junta todo runcmd en un solo script: "set -eu" lo corta en el primer error
            # y las variables (DB_PASS, JWT) siguen vivas entre una linea y la siguiente.
            runcmd:
              - set -eu
              - curl -LsSf https://astral.sh/uv/install.sh -o /tmp/uv-install.sh
              - env UV_INSTALL_DIR=/usr/local/bin sh /tmp/uv-install.sh
              - systemctl enable --now postgresql
              # Credenciales aleatorias creadas en el servidor: no pasan por la plantilla ni por ningun estado.
              - DB_PASS=$(openssl rand -hex 24)
              - JWT=$(openssl rand -hex 48)
              - sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE asistencia LOGIN PASSWORD '$DB_PASS'"
              - sudo -u postgres createdb -O asistencia asistencia
              - install -d -o ubuntu -g ubuntu /opt/presencia
              - sudo -u ubuntu git clone --depth 1 --branch ${repo_branch} ${repo_url} /opt/presencia/app
              - |
                umask 077
                cat > /opt/presencia/app/backend/.env <<EOF
                ENVIRONMENT=production
                DATABASE_URL=postgresql+psycopg://asistencia:$DB_PASS@localhost:5432/asistencia
                JWT_SECRET=$JWT
                TIMEZONE=America/La_Paz
                EOF
                chown ubuntu:ubuntu /opt/presencia/app/backend/.env
                umask 022
              - >-
                sudo -u ubuntu -H bash -c "cd /opt/presencia/app/backend && uv sync --locked --no-dev
                && uv run --no-dev alembic upgrade head
                && uv run --no-dev python -m app.seed ${seed_args}"
              - systemctl daemon-reload
              - systemctl enable --now presencia-backend
              - curl -fsS --retry 20 --retry-delay 3 --retry-connrefused http://127.0.0.1:8000/health

            final_message: "Presencia backend listo tras $UPTIME s (cloud-init $VERSION)"
          - repo_url: !Ref RepoUrl
            repo_branch: !Ref RepoBranch
            seed_args: !If [CargarDemo, "--demo", ""]
      Tags:
        - Key: Name
          Value: !Sub "${Proyecto}-${Ambiente}-backend"
        - Key: Role
          Value: backend

Outputs:
  FrontendInstanceId:
    Condition: DesplegarFrontend
    Value: !Ref FrontendInstance

  FrontendPublicIp:
    Condition: DesplegarFrontend
    Description: IP elastica del frontend
    Value: !Ref FrontendEip

  FrontendPrivateIp:
    Condition: DesplegarFrontend
    Value: !GetAtt FrontendInstance.PrivateIp

  BackendInstanceId:
    Condition: DesplegarBackend
    Value: !Ref BackendInstance

  BackendPublicIp:
    Condition: BackendConIpPublica
    Value: !GetAtt BackendInstance.PublicIp

  BackendPrivateIp:
    Condition: DesplegarBackend
    Value: !GetAtt BackendInstance.PrivateIp

  ApiUrlInterna:
    Condition: DesplegarBackend
    Description: URL privada de FastAPI (API_URL del frontend)
    Value: !Sub "http://${BackendInstance.PrivateIp}:8000"

  SshFrontend:
    Condition: DesplegarFrontend
    Value: !Sub "ssh -i ~/.ssh/presencia-aws ubuntu@${FrontendEip}"

  SshBackend:
    Condition: BackendConIpPublica
    Value: !Sub "ssh -i ~/.ssh/presencia-aws ubuntu@${BackendInstance.PublicIp}"

  UrlAplicacion:
    Condition: DesplegarFrontend
    Description: La web (lista unos 10-15 min despues de CREATE_COMPLETE)
    Value: !Sub "http://${FrontendEip}"
