# EC2 frontend → /etc/nginx/sites-available/presencia (instalación manual:
# docs/despliegue-clase2.md, paso 6). __SERVER_NAME__ se reemplaza por el dominio, o por "_"
# si se usa la IP. Con dominio, `certbot --nginx` añade el bloque 443 y la redirección a HTTPS.
upstream presencia_next {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name __SERVER_NAME__;
    server_tokens off;

    # FastAPI acepta Excel de hasta 5 MB (backend/app/api/v1/imports.py); Nginx limita a 1 MB por defecto.
    client_max_body_size 6m;

    location / {
        proxy_pass http://presencia_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Con "https" la cookie de sesión sale con Secure (frontend/src/app/api/auth/login/route.ts).
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
