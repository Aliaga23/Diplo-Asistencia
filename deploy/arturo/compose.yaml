# Presencia en el VPS «arturo»: https://${DOMINIO} detrás del Traefik compartido (/opt/edge).
# Ver la sección Despliegue del README.
#
# El compose lo manda el REPOSITORIO: cada despliegue lo sube, lo valida y lo reemplaza
# (.github/workflows/desplegar.yml). En el servidor solo vive .env, que crea una vez
# deploy/arturo/preparar.sh y que nunca sale de la máquina.
#
# El VPS no compila: las imágenes llegan de GHCR con el tag de IMAGE_TAG (.env).
# Solo el frontend se publica (red `edge` + labels). La API y PostgreSQL viven en la red
# `interna`, sin salida a internet ni puertos publicados.

name: diplo-asistencia

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

# Los procesos de la aplicación corren sin privilegios y no necesitan capacidades.
x-hardening: &hardening
  <<: *logging
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

services:
  db:
    <<: *logging
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: asistencia
      POSTGRES_USER: asistencia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      TZ: America/La_Paz
    volumes:
      # PostgreSQL 18 guarda los datos en /var/lib/postgresql/<versión>/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asistencia -d asistencia"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    networks:
      interna:
        # Alias propio: la red `edge` es compartida y otro proyecto puede tener un «db».
        aliases: [diplo-db]

  backend:
    <<: *hardening
    image: ghcr.io/${GHCR_OWNER:-aliaga23}/diplo-asistencia/backend:${IMAGE_TAG:?falta IMAGE_TAG en .env}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://asistencia:${POSTGRES_PASSWORD}@diplo-db:5432/asistencia
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      ENVIRONMENT: production
      TIMEZONE: America/La_Paz
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD:-admin1234!}
      ADMIN_REGISTRATION: ${ADMIN_REGISTRATION:-218166141}
      SEED_DEMO: ${SEED_DEMO:-true}
      CORS_ORIGINS: '["https://${DOMINIO:?falta DOMINIO en .env}"]'
    mem_limit: 512m
    networks:
      interna:
        aliases: [diplo-backend]

  frontend:
    <<: *hardening
    image: ghcr.io/${GHCR_OWNER:-aliaga23}/diplo-asistencia/frontend:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_URL: http://diplo-backend:8000
      COOKIE_SECURE: "true"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 3s
      retries: 6
    mem_limit: 384m
    networks: [interna, edge]
    labels:
      traefik.enable: "true"
      traefik.docker.network: edge
      # Aplicación
      traefik.http.routers.diplo-web.rule: Host(`${DOMINIO}`)
      traefik.http.routers.diplo-web.entrypoints: websecure
      traefik.http.routers.diplo-web.tls: "true"
      traefik.http.routers.diplo-web.priority: "1"
      traefik.http.routers.diplo-web.middlewares: diplo-compress@docker,diplo-headers@docker
      # Inicio de sesión: límite de peticiones por IP real (Cloudflare → Traefik).
      traefik.http.routers.diplo-auth.rule: Host(`${DOMINIO}`) && PathPrefix(`/api/auth`)
      traefik.http.routers.diplo-auth.entrypoints: websecure
      traefik.http.routers.diplo-auth.tls: "true"
      traefik.http.routers.diplo-auth.priority: "100"
      traefik.http.routers.diplo-auth.service: diplo-web
      traefik.http.routers.diplo-auth.middlewares: diplo-headers@docker,diplo-ratelimit@docker
      traefik.http.services.diplo-web.loadbalancer.server.port: "3000"
      # Middlewares
      traefik.http.middlewares.diplo-compress.compress.encodings: zstd,br,gzip
      traefik.http.middlewares.diplo-headers.headers.frameDeny: "true"
      traefik.http.middlewares.diplo-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.diplo-headers.headers.referrerPolicy: strict-origin-when-cross-origin
      traefik.http.middlewares.diplo-headers.headers.permissionsPolicy: camera=(), microphone=(), geolocation=()
      traefik.http.middlewares.diplo-headers.headers.stsSeconds: "31536000"
      traefik.http.middlewares.diplo-ratelimit.ratelimit.average: "10"
      traefik.http.middlewares.diplo-ratelimit.ratelimit.burst: "20"
      traefik.http.middlewares.diplo-ratelimit.ratelimit.period: 1s
      traefik.http.middlewares.diplo-ratelimit.ratelimit.sourcecriterion.ipstrategy.depth: "1"

networks:
  interna:
    # Sin salida a internet: la API y la base solo se ven entre sí y con el frontend.
    internal: true
  edge:
    external: true

volumes:
  pgdata:
