[project]
name = "asistencia-backend"
version = "1.0.0"
description = "API de registro de asistencia (FastAPI)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pydantic[email]",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "reportlab>=4.2",
    "playwright>=1.47",
    "httpx2>=2.13.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
